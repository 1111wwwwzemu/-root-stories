<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROOT STORIES · SPECT</title>
<style>
:root{
  --bg:#f7f3ea;--paper:#fcfaf5;--ink:#37342f;
  --muted:#82796d;--line:#ddd5c7;--accent:#8d7760;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
}
main{max-width:900px;margin:auto;padding:48px 22px 70px}
.top{font-size:13px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
h1{font-size:54px;font-weight:500;line-height:1.05;margin:14px 0 8px}
.sub{color:var(--muted);font-size:18px}
.root{
  display:inline-block;margin:22px 0;padding:9px 14px;
  border:1px solid var(--line);border-radius:999px;background:#f0e9dc
}
.scene{
  margin-top:22px;background:var(--paper);border:1px solid var(--line);
  border-radius:20px;padding:30px;
  box-shadow:0 12px 30px rgba(50,44,34,.06)
}
.story{font-size:22px;line-height:1.75;min-height:220px}
.word{border-bottom:1px dashed #a9957d;cursor:pointer}
.word:hover{background:#f1eadf}
button{
  border:1px solid #c9bba8;background:#eee5d8;color:var(--ink);
  padding:11px 16px;border-radius:999px;font:16px Georgia,serif;cursor:pointer
}
button:hover{background:#e7ddcd}
.note{margin-top:18px;color:var(--muted);font-size:14px}
.pop{
  position:fixed;display:none;z-index:10;background:#fffdf8;
  border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.14);
  padding:12px 14px;max-width:280px
}
.pop b{font-size:18px}.pop small{color:var(--muted)}
.progress{
  margin-top:16px;width:100%;height:4px;background:#e8e0d3;border-radius:99px;
  overflow:hidden
}
.progress i{display:block;height:100%;width:25%;background:var(--accent);transition:.3s}
.footer{margin-top:35px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:600px){
  h1{font-size:40px}.story{font-size:19px}
}
</style>
</head>
<body>
<main>
  <div class="top">ROOT STORIES · 01</div>
  <h1>SPECT</h1>
  <div class="sub">to look · to see</div>
  <div class="root">One root. One story. Three turns.</div>

  <section class="scene">
    <div class="story" id="story"></div>
    <button id="next">Look again →</button>
    <div class="progress"><i id="bar"></i></div>
    <div class="note" id="note"></div>
  </section>

  <div class="footer">
    English is the door. Curiosity is the reason you walk through it.
  </div>
</main>

<div class="pop" id="pop">
  <b id="pw"></b><br>
  <small id="pm"></small>
</div>

<script>
const scenes=[
{
 text:'At 8:17 p.m., a man walked into the museum. The guard asked, “Did you <span class="word" data-w="see">see</span> the painting?”',
 note:'SPECT = see.',
 button:'Look again →'
},
{
 text:'“No,” he said. “I saw nothing.” But the guard asked him to <span class="word" data-w="inspect">inspect</span> the empty display case.',
 note:'inspect = look closely.',
 button:'Something is wrong →'
},
{
 text:'Then you notice paint on his sleeve. You <span class="word" data-w="suspect">suspect</span> him. But the paint is from the wall he repaired that afternoon.',
 note:'suspect = begin to think someone may be responsible.',
 button:'The last turn →'
},
{
 text:'The painting was gone before he arrived. He was telling the truth. The mistake was simple: everyone was <span class="word" data-w="spectator">looking</span> at the wrong thing.',
 note:'spectator = someone who watches. Same root.',
 button:'Start again'
}
];

const dict={
  see:['看见','I saw the painting.'],
  inspect:['仔细查看','Inspect the room.'],
  suspect:['怀疑','I suspect him.'],
  spectator:['旁观者','He was only a spectator.']
};

let i=0;
const story=document.getElementById('story');
const note=document.getElementById('note');
const next=document.getElementById('next');
const pop=document.getElementById('pop');
const bar=document.getElementById('bar');

function render(){
  const s=scenes[i];
  story.innerHTML=s.text;
  note.textContent=s.note;
  next.textContent=s.button;
  bar.style.width=((i+1)/scenes.length*100)+'%';

  document.querySelectorAll('.word').forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      const d=dict[el.dataset.w]||['',''];
      document.getElementById('pw').textContent=el.dataset.w;
      document.getElementById('pm').textContent=d[0]+' · '+d[1];
      const r=el.getBoundingClientRect();
      pop.style.left=Math.min(Math.max(12,r.left),innerWidth-292)+'px';
      pop.style.top=Math.min(r.bottom+8,innerHeight-100)+'px';
      pop.style.display='block';
    };
  });
}

next.onclick=()=>{
  if(i<scenes.length-1)i++;
  else i=0;
  pop.style.display='none';
  render();
};

document.addEventListener('click',e=>{
  if(!e.target.closest('.pop')&&!e.target.closest('.word')){
    pop.style.display='none';
  }
});

render();
</script>
</body>
</html>
